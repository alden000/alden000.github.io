<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>wwweeeiii</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#041113" />
<style>
  :root {
    color-scheme: dark;
    --canvas: #041113; --text: #eef6f4; --text-2: #9cb9b6;
    --g1: rgba(13, 148, 136, 0.45); --g2: rgba(14, 94, 112, 0.55); --g3: rgba(242, 104, 90, 0.2);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --canvas: #f1f7f6; --text: #072226; --text-2: #3f5e5d;
      --g1: rgba(153, 227, 216, 0.6); --g2: rgba(178, 220, 232, 0.6); --g3: rgba(255, 205, 186, 0.6);
    }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px;
    background: var(--canvas); color: var(--text); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .backdrop { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
  .backdrop i { position: absolute; border-radius: 50%; }
  .backdrop i:nth-child(1) { width: 110vmax; height: 110vmax; left: -45vmax; top: -70vmax; background: radial-gradient(closest-side, var(--g1), transparent); animation: orbit 23s linear infinite; }
  .backdrop i:nth-child(2) { width: 95vmax; height: 95vmax; right: -45vmax; top: -60vmax; background: radial-gradient(closest-side, var(--g2), transparent); animation: orbit 31s linear infinite; }
  .backdrop i:nth-child(3) { width: 75vmax; height: 75vmax; left: 10vmax; top: -45vmax; background: radial-gradient(closest-side, var(--g3), transparent); animation: orbit 19s linear infinite reverse; }
  @keyframes orbit { from { transform: rotate(0) translateX(5vmax) rotate(0); } to { transform: rotate(360deg) translateX(5vmax) rotate(-360deg); } }
  h1 { font-size: clamp(30px, 7vw, 46px); font-weight: 800; letter-spacing: -0.03em; margin: 0 0 6px; }
  p { margin: 0; color: var(--text-2); }
  @media (prefers-reduced-motion: reduce) { .backdrop i { animation: none; } }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
  <main>
    <h1>wwweeeiii</h1>
    <p>Nothing to see here.</p>
  </main>
</body>
</html>
