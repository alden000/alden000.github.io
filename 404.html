<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not found</title>
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: dark; --canvas: #041113; --text: #eef6f4; --text-2: #9cb9b6; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --canvas: #f1f7f6; --text: #072226; --text-2: #3f5e5d; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; background: var(--canvas); color: var(--text); font: 15px/1.5 system-ui, sans-serif; padding: 16px; }
  h1 { font: 800 44px/1 system-ui, sans-serif; margin: 0 0 8px; letter-spacing: -0.03em; }
  p { color: var(--text-2); }
  a { display: inline-block; margin-top: 10px; padding: 10px 18px; border-radius: 999px; font-weight: 700; color: #2a0f0b; text-decoration: none; background: linear-gradient(110deg, #f2685a, #ff8a6b 55%, #ffbb8f); }
</style>
</head>
<body>
  <div>
    <h1>Not found</h1>
    <p>There's nothing at this address.</p>
  </div>
</body>
</html>
